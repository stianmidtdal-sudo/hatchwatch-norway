<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HatchWatch · Innlogging</title>
    <meta name="theme-color" content="#0b1418">
    <link rel="icon" type="image/png" sizes="32x32" href="/logos/favicon-32.png?v=2">
    <link rel="stylesheet" href="/hw.css">
    <style>
        /* v3 (2026-10-01): samme skinn som resten. Kun beskyttede sider havner her. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body.hw-dark { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
        .box { background: var(--hw-bg-2); border: 1px solid var(--hw-line); border-radius: var(--hw-radius); padding: 32px 28px; width: 100%; max-width: 360px; text-align: center; }
        .mark { display: flex; justify-content: center; margin-bottom: 14px; }
        h1 { font-family: var(--hw-display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
        .sub { font-family: var(--hw-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--hw-fg-3); margin: 6px 0 24px; }
        input[type="password"] { width: 100%; padding: 12px 14px; border: 1px solid var(--hw-line); border-radius: var(--hw-radius-sm); background: var(--hw-bg-3); color: var(--hw-fg); font: inherit; font-size: 16px; text-align: center; letter-spacing: .1em; outline: none; }
        input[type="password"]:focus { border-color: var(--hw-hatch); }
        button { width: 100%; margin-top: 12px; }
        .error { margin-top: 14px; font-size: 13.5px; color: var(--hw-bad); display: none; }
        .error.visible { display: block; }
    </style>
</head>
<body class="hw-dark">
<div class="box">
    <div class="mark"><span class="hw-fly" style="width:64px;color:var(--hw-hatch)"></span></div>
    <h1>HatchWatch</h1>
    <div class="sub">Beskyttet side · logg inn</div>
    <form method="POST" action="/api/login" id="form">
        <input type="password" name="pw" placeholder="Passord" autocomplete="current-password" autofocus aria-label="Passord">
        <button type="submit" class="hw-btn primary">Logg inn</button>
    </form>
    <div class="error" id="err">Feil passord. Prøv igjen.</div>
</div>
<script>
    const params = new URLSearchParams(location.search);
    if (params.get('err')) {
        document.getElementById('err').classList.add('visible');
    }
    // Hvis middleware sendte oss hit med ?next=/dashboard.html?loc=xxx,
    // ta med den destinasjonen som hidden felt så vi kan redirecte dit etter innlogging
    const next = params.get('next');
    if (next) {
        const hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = 'next';
        hidden.value = next;
        document.getElementById('form').appendChild(hidden);
    }
</script>
</body>
</html>
