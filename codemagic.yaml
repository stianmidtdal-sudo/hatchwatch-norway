# Codemagic — bygger HatchWatch iOS-appen (Capacitor) og sender til TestFlight.
# Kjøres på Codemagics Mac-maskiner. Ingen Mac trengs lokalt.
#
# Forutsetninger i Codemagic (gjøres én gang i nettleseren):
#   1. Team settings → Integrations → App Store Connect: legg inn API-nøkkel
#      fra Apple med navnet "HatchWatch ASC".
#   2. Appen "HatchWatch" med bundle-ID no.hatchwatch.app må finnes i
#      App Store Connect før første bygg (Codemagic lager sertifikater selv).

workflows:
  ios-testflight:
    name: HatchWatch iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: HatchWatch ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: no.hatchwatch.app
      xcode: latest
      node: 22
    scripts:
      - name: Installer npm-pakker
        script: |
          cd app
          npm ci
      - name: Synkroniser Capacitor → iOS
        script: |
          cd app
          npx cap sync ios
      - name: Sett opp signering
        script: |
          xcode-project use-profiles
      - name: Sett byggenummer
        script: |
          cd app/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Bygg .ipa
        script: |
          cd app/ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
    artifacts:
      - app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
