<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-itunes-app" content="app-id=6817913220">   <!-- Apples app-banner i Safari på iPhone (2026-10-15) -->
<title>HatchWatch — Norgeskartet</title>
<meta name="theme-color" content="#0b1418">
<meta name="description" content="Klekkeprognoser og isgang for fluefiskere, og lakseelver med fangstkurver: hele Norge på ett kart.">
<link rel="icon" type="image/png" sizes="32x32" href="/logos/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/logos/apple-touch-icon-180.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/hw.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="/hw-lang.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  /* ═══ KARTFORSIDE v4 — ekte kart (2026-10-14) ═══
     MapLibre + egne kartfliser (data/kart/hatchwatch.pmtiles: alle NVE-vann ≥ 10 ha
     og alle lakseførende strekninger) på mørk OpenStreetMap-bakgrunn (OpenFreeMap).
     Bryter Tørrflue | Laksefiske. Tørrflue: HatchWatch-lokasjonene med prognosestatus
     (som før) + isgang per vann fra satellitt. Laksefiske: elvene farget etter fangst-
     kurven for valgt uke, elvesider på /elv.html. v3 (SVG-Norge) ligger i arkiv/.
     Data bygges med tools/kart/bygg_kart.py. */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  body.hw-has-bar { padding-bottom: calc(var(--hw-bar-h, 64px) - 1px); }   /* kartet går helt ned til baren (høyden står i hw.css) */
  #map { flex: 1; position: relative; overflow: hidden; min-height: 0; background: #13242b; }
  :root[data-theme="light"] #map { background: #e0fefe; }   /* lyst: ingen mørk flate før kartet er tegnet */
  #gl { position: absolute; inset: 0; }

  .maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--hw-bg) 80%, transparent) !important; color: var(--hw-fg-3) !important; font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: var(--hw-fg-2) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(.8); }
  /* Kildeknappen: mobil over zoomknappene til høyre, PC nede til venstre under forklaringen */
  .maplibregl-ctrl-bottom-right { bottom: calc(var(--scrub-h, 190px) + 240px); }
  .maplibregl-ctrl-geolocate { display: none !important; }   /* vår egen knapp (gpsBtn) styrer kontrollen */
  .maplibregl-ctrl-bottom-left { bottom: 6px; }

  /* ── Topp: merke, bryter, søk ── */
  .maptop { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 22; display: flex; flex-direction: column; gap: 8px; max-width: 560px; margin: 0 auto; }
  .brandrow { display: flex; align-items: center; gap: 8px; padding: 0 4px; text-decoration: none; color: var(--hw-fg); width: fit-content; }
  .brandrow .wm { font-family: var(--hw-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; line-height: 1; }
  .brandrow .wm b { color: var(--hw-hatch); font-weight: 700; }
  .modeseg { display: grid; grid-template-columns: 1fr 1fr; background: color-mix(in srgb, var(--hw-bg-3) 92%, transparent); backdrop-filter: blur(8px); border-radius: 12px; padding: 3px; }
  .modeseg button { padding: 8px 0; border-radius: 9px; font-weight: 500; font-size: 14px; color: var(--hw-fg-2); }
  .modeseg button.on { background: var(--hw-bg-2); color: var(--hw-fg); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .searchrow { display: flex; gap: 8px; align-items: center; }
  /* PC (2026-10-14, Stian): merket alene øverst til venstre, et hakk større. Søket midtstilt
     øverst, bryteren Tørrflue | Laksefiske midtstilt rett under. */
  .brandrow .wm { font-size: 25px; }
  .brandrow .hw-fly { width: 42px !important; }
  @media (min-width: 760px) {
    .maptop { align-items: center; max-width: none; margin: 0; }
    .brandrow { position: absolute; left: 4px; top: 4px; }
    .brandrow .wm { font-size: 28px; }
    .brandrow .hw-fly { width: 48px !important; }
    .searchrow { order: 1; width: min(520px, calc(100vw - 540px)); min-width: 260px; }
    .modeseg { order: 2; width: 260px; }
  }
  .search { flex: 1; position: relative; }
  .search-in { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--hw-bg-2) 94%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--hw-line); border-radius: 999px; padding: 9px 12px; color: var(--hw-fg-3); }
  .search-in svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
  .search-in input { flex: 1; min-width: 0; background: none; border: 0; color: var(--hw-fg); font: inherit; font-size: 14px; outline: none; }
  .search-in input::placeholder { color: var(--hw-fg-3); }
  #hits { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--hw-bg-2); border: 1px solid var(--hw-line); border-radius: 14px; overflow: hidden; display: none; box-shadow: var(--hw-shadow); max-height: 60vh; overflow-y: auto; }
  #hits.open { display: block; }
  .hit { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--hw-line); }
  .hit:last-child { border-bottom: 0; }
  .hit b { font-family: var(--hw-display); font-weight: 700; font-size: 15px; }
  .hit small { display: block; font-size: 12px; color: var(--hw-fg-2); }
  .hit .hw-chip { padding: 2px 8px; }
  .hit .t { font-family: var(--hw-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--hw-fg-3); white-space: nowrap; }
  .hit-head { padding: 8px 14px 4px; font-family: var(--hw-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--hw-fg-3); }
  .hit-empty { padding: 12px 14px; color: var(--hw-fg-2); font-size: 13px; }

  /* ── Legende + zoom ── */
  /* Forklaringen nede til venstre (2026-10-14, Stian). Mobil: én rad rett over skyveren som kan
     skyves sidelengs. PC: kolonne nede til venstre (skyveren ligger til høyre). */
  .legend { position: absolute; left: 12px; right: 62px; bottom: calc(var(--scrub-h, 190px) + 18px); z-index: 18; display: flex; flex-direction: row; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .legend::-webkit-scrollbar { display: none; }
  .legend .hw-chip { flex: none; }
  @media (min-width: 760px) { .legend { right: auto; bottom: 52px; flex-direction: column; overflow: visible; pointer-events: none; } }
  .legend .hw-chip { background: color-mix(in srgb, var(--hw-bg) 85%, transparent); backdrop-filter: blur(6px); }
  .legend .hw-chip i.ice { background: #93a9b4; } .legend .hw-chip i.open { background: #1a8cc0; } .legend .hw-chip i.nod { background: #cfd8d6; }   /* = ISFARGE */
  .legend .hw-chip i.line { border-radius: 2px; width: 14px; height: 4px; }
  .zoomctl { position: absolute; right: 12px; bottom: calc(var(--scrub-h, 190px) + 20px); z-index: 20; display: flex; flex-direction: column; gap: 6px; }
  .zoomctl button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--hw-line); background: color-mix(in srgb, var(--hw-bg-2) 92%, transparent); color: var(--hw-fg); font-size: 1.15rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(6px); }
  /* Kartlag (2026-10-14, Stian): Standard eller Turkart (Kartverkets topo + Turrutebasen). Standard er alltid
     utgangspunktet; Turkart vises bare når brukeren velger det (valget huskes på enheten). */
  .zoomctl #lagBtn { display: grid; place-items: center; }
  .zoomctl #lagBtn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linejoin: round; }
  .zoomctl #lagBtn.on { color: var(--hw-hatch); border-color: color-mix(in srgb, var(--hw-hatch) 55%, transparent); }
  .lagvalg { position: absolute; right: 58px; bottom: calc(var(--scrub-h, 190px) + 196px); z-index: 24; display: none; gap: 8px; padding: 8px; border-radius: 14px; background: var(--hw-bg-2); border: 1px solid var(--hw-line); box-shadow: var(--hw-shadow); }
  .lagvalg.open { display: flex; }
  /* Overlegg (2026-10-15): kalk i berggrunnen fra NGU, kan slås på oppå både Lyst og Mørkt */
  .lagvalg { flex-wrap: wrap; width: 220px; }
  .lagvalg-hode { flex-basis: 100%; font-family: var(--hw-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--hw-fg-3); padding: 2px 4px 0; }
  .lagvalg .overlegg { flex-basis: 100%; display: flex; align-items: center; gap: 10px; padding: 4px 4px 2px; cursor: pointer; color: var(--hw-fg); }
  .lagvalg .overlegg input { width: 18px; height: 18px; accent-color: var(--hw-hatch); flex: none; margin: 0; }
  .lagvalg .overlegg b { display: block; font-size: 13px; font-weight: 600; }
  .lagvalg .overlegg small { display: block; font-size: 11.5px; color: var(--hw-fg-3); }
  .legend .leg-hode { font-family: var(--hw-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--hw-fg-3); padding: 6px 2px 0; flex: none; }
  .legend .hw-chip i.kalk { border-radius: 2px; border: 1px solid rgba(0, 0, 0, .12); }
  @media (min-width: 760px) { .legend .leg-hode { background: color-mix(in srgb, var(--hw-bg) 85%, transparent); border-radius: 6px; padding: 3px 6px; width: fit-content; } }
  /* Skjul tidsskyveren (2026-10-14, Stian: tar mye plass på mobil): krysset gjør den om til en liten
     knapp nede til venstre; trykk på knappen åpner den igjen. Valget huskes (hw_skyver). */
  .scrub .top { align-items: flex-start; }
  .scrub .play.lukk { margin-left: -2px; }
  .scrub .play.lukk svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; width: 12px; height: 12px; }
  .scrubmini { position: absolute; left: 12px; bottom: 12px; z-index: 21; display: none; align-items: center; gap: 7px; padding: 8px 14px 8px 10px; border-radius: 999px; background: color-mix(in srgb, var(--hw-bg-2) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--hw-line); color: var(--hw-fg); font-size: 13.5px; font-weight: 500; }
  .scrubmini svg { width: 17px; height: 17px; fill: none; stroke: var(--hw-hatch); stroke-width: 1.8; stroke-linecap: round; }
  body.skyver-liten .scrub { display: none; }
  body.skyver-liten .scrubmini { display: inline-flex; }
  @media (min-width: 760px) { .scrubmini { left: auto; right: 12px; } }
  /* Avstandsmåling (2026-10-14): panel der skyveren står mens man måler */
  /* Lokasjonsknappen øverst (2026-10-15): blå når den følger deg, halvgjennomsiktig mens den venter på posisjon */
  #locateBtn.on { color: #4aa3ff; border-color: color-mix(in srgb, #4aa3ff 55%, transparent); }
  #locateBtn.on svg circle:last-of-type { fill: currentColor; }
  #locateBtn.venter { opacity: .6; }
  /* Her er jeg med retning (2026-10-15, Stian): egen prikk med kjegle som følger telefonens kompass
     (MapLibres egen retning bruker bare GPS-kursen, som forsvinner når man står stille). Nøyaktighetsringen
     er fortsatt MapLibres. */
  .maplibregl-user-location-dot { display: none !important; }
  .meg { width: 72px; height: 72px; pointer-events: none; }
  .meg svg { width: 72px; height: 72px; display: block; overflow: visible; }
  .meg .kjegle { opacity: 0; transition: opacity .3s; }
  .meg.retning .kjegle { opacity: 1; }
  /* Kompass øverst til høyre: nålen viser kartets nord; trykk = kartet følger retningen telefonen peker */
  .kompass { position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 23; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hw-line); background: color-mix(in srgb, var(--hw-bg-2) 92%, transparent); backdrop-filter: blur(6px); display: grid; place-items: center; cursor: pointer; color: var(--hw-fg-2); }
  .kompass svg { width: 26px; height: 26px; display: block; }
  .kompass.folg { border-color: #4aa3ff; box-shadow: 0 0 0 2px rgba(74, 163, 255, .35); color: #4aa3ff; }
  .kompass.ingen { opacity: .5; }
  @media (min-width: 760px) { .kompass { top: 14px; } }
  .zoomctl #maalBtn { display: grid; place-items: center; }
  .zoomctl #maalBtn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .zoomctl #maalBtn.on { color: var(--hw-hatch); border-color: color-mix(in srgb, var(--hw-hatch) 55%, transparent); }
  .maal { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 23; max-width: 560px; margin: 0 auto; display: none; background: color-mix(in srgb, var(--hw-bg-2) 95%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--hw-line); border-radius: 16px; padding: 12px 14px; }
  .maal.open { display: block; }
  @media (min-width: 760px) { .maal { left: auto; right: 12px; width: 440px; margin: 0; } }
  .maal .topp { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .maal .topp-h { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .maal .topp-h .hw-btn { padding: 8px 16px; font-size: 14px; }
  .maal .topp-h .hw-btn:disabled { opacity: .4; cursor: default; }
  .maal .lukk { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--hw-fg-2); margin-left: 6px; }
  .maal .lukk svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .maal .tot { font-family: var(--hw-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; }
  .maal .hint { font-size: 13px; color: var(--hw-fg-2); margin-top: 2px; }
  .maal .knapper { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .maal .knapper button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--hw-line); font-size: 13px; color: var(--hw-fg); }
  .maal .knapper button:disabled { opacity: .4; }
  .maal svg.profil { width: 100%; height: auto; display: block; margin-top: 10px; }
  .maal svg.profil text { font-family: var(--hw-mono); font-size: 10px; fill: var(--hw-fg-3); }
  .maal .pinfo { font-size: 12.5px; color: var(--hw-fg-2); margin-top: 4px; }
  .maal .turtid { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .maal .turtid .k { display: block; font-family: var(--hw-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--hw-fg-3); }
  .maal .turtid b { font-family: var(--hw-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
  .maal .fart { display: inline-flex; background: var(--hw-bg-3); border-radius: 10px; padding: 3px; }
  .maal .fart button { padding: 5px 10px; border-radius: 8px; font-size: 12.5px; color: var(--hw-fg-2); }
  .maal .fart button.on { background: var(--hw-bg-2); color: var(--hw-fg); font-weight: 600; }
  /* Turkart (2026-10-15, Stian): ingen mørk boks bak merket — i stedet en tynn, flat mørk kontur rundt bokstavene
     og flua (ingen myk skygge: Stian ville ha ren 2D). Filteret ligger på hele merket fordi flua er en maskert flate
     (filter rett på den blir maskert bort). Hver drop-shadow bygger på den forrige, så fire retninger gir full kant. */
  /* Bokstavene: tekstkontur der streken males under fyllet (paint-order), så 2 px strek gir 1 px kant utenfor —
     skarp og like tykk på alle sider på alle skjermer, også iPhone. Flua er en maskert flate og kan ikke ha
     tekstkontur; den får tre sentrerte skygger på en egen ramme (filter rett på flua blir maskert bort).
     Forskjøvne skygger er droppet: de ble rundet skjevt på skalerte skjermer (tykkere kant oppe til venstre). */
  .flyramme { display: inline-flex; line-height: 0; }
  body.kart-tur .brandrow .wm { -webkit-text-stroke: 2px #0b1418; paint-order: stroke fill; }
  body.kart-tur .brandrow .flyramme { filter: drop-shadow(0 0 .6px #0b1418) drop-shadow(0 0 .6px #0b1418) drop-shadow(0 0 .6px #0b1418); }
  /* Lyst grensesnitt på Turkart (2026-10-15, Stian: «rent og cleant, hvitt»). Alt som flyter over kartet får det
     lyse token-settet fra hw.css (samme verdier som :root[data-theme="light"]), så farger og kanter følger systemet.
     Bunnbaren og helskjermpanelene (Nå i Norge, Lakseelver) beholder appens mørke ramme. */
  body.kart-tur :is(.maptop, .legend, .maal, .lagvalg, .zoomctl, .scrub, .scrubmini, .sheet, .kompass, .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right) {
    --hw-bg: #f2f6f5; --hw-bg-2: #ffffff; --hw-bg-3: #e6eeec; --hw-bg-4: #d9e4e1; --hw-line: #d3dedb;
    --hw-fg: #11201f; --hw-fg-2: #56696a; --hw-fg-3: #8a9c9c;
    --hw-water: #1a8cc0; --hw-water-soft: rgba(26, 140, 192, .14); --hw-hatch: #c98a12; --hw-hatch-soft: rgba(201, 138, 18, .16); --hw-hatch-ink: #ffffff;
    --hw-far: #b8c6c4; --hw-coming: #7fb9d3; --hw-shadow: 0 18px 40px rgba(20, 40, 40, .18);
    color: var(--hw-fg);   /* tekst uten egen farge arver ellers den lyse fargen fra body */
  }
  /* Merket ligger over kartet og skal alltid ha hvit «Hatch» og lys gull, også når appen har lyst tema */
  .brandrow { --hw-fg: #e9f1ef; --hw-hatch: #f2b84b; }
  /* Hvite flater på lyst kart trenger en svak skygge for å skille seg fra bunnen */
  body.kart-tur :is(.search-in, .modeseg, .zoomctl button, .scrub, .scrubmini, .maal, .legend .hw-chip, .kompass) { box-shadow: 0 1px 2px rgba(20, 40, 40, .10), 0 3px 10px rgba(20, 40, 40, .08); }
  body.kart-tur .modeseg { background: color-mix(in srgb, #ffffff 94%, transparent); border: 1px solid var(--hw-line); }
  body.kart-tur .modeseg button.on { background: #11201f; color: #ffffff; box-shadow: none; }
  body.kart-tur .legend .hw-chip { background: color-mix(in srgb, #ffffff 94%, transparent); }
  body.kart-tur .legend .hw-chip i.ice { background: #9fb8c2; }
  body.kart-tur .years button.on { color: #ffffff; }
  body.kart-tur .sheet { box-shadow: 0 -8px 28px rgba(20, 40, 40, .16); }
  body.kart-tur .maplibregl-ctrl-attrib-button { filter: none; opacity: .55; }
  .lagvalg button { width: 84px; text-align: center; font-size: 12.5px; color: var(--hw-fg-2); }
  .lagvalg button i { display: block; height: 56px; border-radius: 10px; margin-bottom: 5px; border: 2px solid transparent; }
  .lagvalg button.on { color: var(--hw-fg); font-weight: 600; }
  .lagvalg button.on i { border-color: var(--hw-hatch); }
  .lagvalg .std i { background: linear-gradient(135deg, #13242b 0 45%, #2a5361 45% 60%, #13242b 60%); }
  .lagvalg .tur i { background: linear-gradient(135deg, #f3f0e4 0 40%, #a8d4e6 40% 55%, #dfe8cf 55%), #f3f0e4; position: relative; }
  .lagvalg .tur i::after { content: ''; position: absolute; left: 10%; right: 10%; top: 62%; border-top: 2px dashed #e0655a; }

  /* ── Tidsskyver ── */
  .scrub { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 21; max-width: 560px; margin: 0 auto; background: color-mix(in srgb, var(--hw-bg-2) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--hw-line); border-radius: 16px; padding: 10px 14px 12px; }
  .scrub .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 2px; }
  .scrub .date { font-family: var(--hw-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; background: none; border: 0; color: var(--hw-fg); cursor: pointer; padding: 0; text-align: left; }
  .scrub .date small { font-family: var(--hw-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--hw-hatch); margin-left: 8px; }
  .scrub .sum { font-size: 12.5px; color: var(--hw-fg-2); line-height: 1.4; margin-top: 2px; }
  .scrub .sum.ice { color: var(--hw-water); }
  .scrub input[type=range] { width: 100%; accent-color: var(--hw-hatch); margin: 6px 0 2px; }
  .scrub .ticks { display: flex; justify-content: space-between; font-family: var(--hw-mono); font-size: 9.5px; color: var(--hw-fg-3); letter-spacing: .06em; }
  .scrub.hidden { visibility: hidden; }
  .years { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
  .years::-webkit-scrollbar { display: none; }
  .years .lbl { font-family: var(--hw-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--hw-fg-3); flex: none; margin-right: 2px; }

// Høyder for en liste [lon, lat]. open-meteo (Copernicus 90 m) svarer på et øyeblikk og vises først;

// En tur = punktene i streken, kodet som Google-polylinje (presisjon 5, ~1 m) så lenka blir kort:
//   /?tur=<kode>&navn=<navn>  — åpner målemodus med streken. Mine turer: localStorage hw_turer

function kodPolylinje(pkt) {

  pkt.forEach(function (p) { var lat = Math.round(p[1] * 1e5), lon = Math.round(p[0] * 1e5); ut += enc(lat - pl) + enc(lon - pn); pl = lat; pn = lon; });
