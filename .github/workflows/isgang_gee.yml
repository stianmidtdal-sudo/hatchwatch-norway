# Isgang for hele Norge i Google Earth Engine, kjørt hos GitHub i stedet for på
# Stians PC: tools/research_analyser/G_gee/g2_gee_norge.py --norge --fortsett.
# Hver kjøring tar opptil 330 min (tidsvakten i skriptet), lagrer framdrift og
# rådata per enhet, og neste kjøring (hver 6. time) fortsetter der den slapp.
# Kvotevakten (--budsjett-timer) nullstilles av skriptet ved månedsskifte.
#
# Hva som ligger hvor (se RAPPORT_G5.md):
#   * i git (committes av jobben): norge/lett/*.csv (fylkesfilene uten passlista),
#     isgang_norge_index.csv, norge_plan.json, rapport_norge.md
#   * som workflow-artifact «gee-lager» (90 dager, de 2 nyeste beholdes): de
#     FULLE fylkesfilene norge/*.json+*.csv, rådata data/, vannlister vann/ og
#     kjorelogg_g2.json — for store for et offentlig repo, men --fortsett
#     trenger dem. Hver kjøring henter forrige kjørings artifact før start.
#   * første gang: release-asset gee-lager-seed/gee-lager.zip, lagd fra PC-en
#     med g5_lager_til_github.py. Finnes verken artifact eller seed, stopper
#     jobben (ellers ville alt bli hentet på nytt).
#
# Hemmeligheter (Settings → Secrets and variables → Actions):
#   GEE_SERVICE_ACCOUNT_KEY = hele JSON-nøkkelen til servicekontoen
#   GEE_PROJECT             = hatchwatch-isgang

name: isgang-gee

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      fylke:
        description: "Fylkesnr (f.eks. 34) for å kjøre ETT fylke utenom planen; tomt = følg norge_plan.json"
        required: false
        default: ""
      maks_minutter:
        description: "Tidsvakt: send ingen nye enheter etter så mange minutter"
        required: false
        default: "330"
      uten_lager:
        description: "true = start uten artifact/seed (alt hentes på nytt — bare med vilje)"
        required: false
        default: "false"

concurrency:
  group: isgang-gee
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # slette gamle artifacts

env:
  G: tools/research_analyser/G_gee

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # ALLTID toppen av main ved jobbstart — en planlagt kjøring som har stått i kø
                                # bak forrige kjøring låser seg ellers til SHA-en fra køtidspunktet, og
                                # «git pull --rebase» får konflikt i jobbens egne filer (skjedde 2026-10-12)
          fetch-depth: 0        # full historikk, så «git pull --rebase» virker hvis Stian deployer samtidig

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer earthengine-api
        run: python -m pip install --quiet earthengine-api

      - name: Hent lageret (forrige kjørings artifact, ellers release-seed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$G"
          if [ "${{ github.event.inputs.uten_lager }}" = "true" ]; then
            echo "Starter UTEN lager (valgt for hånd)."
            exit 0
          fi
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=gee-lager&per_page=50" \
                --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$RUN" ]; then
            gh run download "$RUN" -n gee-lager -D /tmp/lager
            unzip -oq /tmp/lager/lager.zip -d .
            echo "Lager hentet fra artifact gee-lager (kjøring $RUN)."
          elif gh release download gee-lager-seed -R "$GITHUB_REPOSITORY" -p gee-lager.zip -D /tmp --clobber; then
            # gh i stedet for curl (2026-10-17): virker også når repoet er privat
            unzip -oq /tmp/gee-lager.zip -d .
            echo "Lager hentet fra release gee-lager-seed (engangs-såing fra PC-en)."
          else
            echo "FEIL: fant verken artifact «gee-lager» eller release «gee-lager-seed». Kjør g5_lager_til_github.py på PC-en først" >&2
            echo "(se RAPPORT_G5.md), eller start med uten_lager=true hvis alt virkelig skal hentes på nytt." >&2
            exit 1
          fi
          echo "Fulle fylkesfiler:"; ls -l norge/*.json 2>/dev/null || true
          echo "Rådata:"; ls -l data/ 2>/dev/null || true

      # 2026-10-14: vårmodus (g6_sesong.py) — årets isgang mens sesongen pågår (15. mars–25. juli,
      # høyst annenhver dag). Hele måneder hentes én gang for alle vann; resten av inneværende måned
      # hentes på nytt bare for vann uten sikker isgang ennå. Samme metode, kvotebok og tidsvakt som g2.
      # Feiler den, fortsetter jobben som før. Minuttene den brukte trekkes fra tidsvakten under.
      - name: Vårmodus — årets isgang (g6_sesong.py)
        if: github.event.inputs.fylke == '' || github.event.inputs.fylke == null
        working-directory: tools/research_analyser/G_gee
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          rc=0
          python g6_sesong.py --parallell 4 --budsjett-timer 950 --maks-minutter 150 || rc=$?
          case "$rc" in
            0) echo "Vårmodus ferdig (eller ingenting å gjøre).";;
            3) echo "Vårmodus stoppet av kvotevakten.";;
            4) echo "Vårmodus stoppet av tidsvakten — fortsetter neste kjøring.";;
            *) echo "Vårmodus feilet med kode $rc — fortsetter med resten av jobben." >&2;;
          esac

      - name: Hent og regn isgang i GEE
        working-directory: tools/research_analyser/G_gee
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          MIN="${{ github.event.inputs.maks_minutter || '330' }}"
          MIN=$(( MIN - ${SESONG_MIN:-0} ))          # vårmodus har brukt av den samme 6-timersrammen
          if [ "$MIN" -lt 20 ]; then MIN=20; fi
          FYLKE="${{ github.event.inputs.fylke }}"
          rc=0
          if [ -n "$FYLKE" ]; then
            python g2_gee_norge.py --fylke "$FYLKE" --fortsett --parallell 4 --budsjett-timer 950 --maks-minutter "$MIN" || rc=$?
          else
            python g2_gee_norge.py --norge --fortsett --parallell 4 --budsjett-timer 950 --maks-minutter "$MIN" || rc=$?
          fi
          case "$rc" in
            0) echo "Skriptet ble ferdig (kode 0).";;
            3) echo "Stoppet av kvotevakten (kode 3) — fortsetter neste måned.";;
            4) echo "Stoppet av tidsvakten (kode 4) — fortsetter neste kjøring.";;
            *) echo "Skriptet feilet med kode $rc." >&2; exit "$rc";;
          esac

      - name: Bygg indexfila og de lette fylkesfilene (--samle)
        if: always()
        working-directory: tools/research_analyser/G_gee
        env:
          PYTHONIOENCODING: utf-8
        run: python g2_gee_norge.py --samle

      # 2026-10-14: kartet og vannsidene på hatchwatch.no oppdateres i samme commit, så nye
      # isgangdatoer kommer ut uten at noen kjører noe på PC-en. Bytter bare isgangen i
      # data/kart/isgang_*.json og data/kart/vann/*.json; sperre i skriptet stopper hvis
      # fylkesfilene plutselig har færre vann enn før. Feil her stopper ikke resten av jobben.
      - name: Oppdater kartdata (data/kart) fra fylkesfilene
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/kart/bygg_kart.py isgang-lokal

      - name: Lagre resultatet i repoet
        if: always()
        run: |
          set -euo pipefail
          git config user.name "isgang-gee"
          # Stians noreply-adresse (2026-10-17): Vercel Hobby bygger bare commits fra eieren når repoet er privat
          git config user.email "276699382+stianmidtdal-sudo@users.noreply.github.com"
          for p in "$G/norge/lett" "$G/norge_plan.json" "$G/rapport_norge.md" "$G/isgang_norge_index.csv" \
                   data/kart/isgang_meta.json data/kart/vann; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          for p in data/kart/isgang_*.json; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingen endringer."
            exit 0
          fi
          if [ "$(git diff --cached --name-only)" = "$G/rapport_norge.md" ]; then
            echo "Bare tidsstempelet i rapport_norge.md endret — committer ikke."
            git reset -q
            exit 0
          fi
          git commit -m "isgang-gee: $(date -u +%F) $(date -u +%H:%M) UTC"
          # -X theirs under rebase = behold JOBBENS versjon ved konflikt: filene er alltid en komplett
          # regenerering fra det nyeste mellomlageret, så jobbens versjon er den riktige.
          git pull --rebase --autostash -X theirs origin main
          git push

      - name: Pakk lageret (fulle fylkesfiler, rådata, vannlister)
        if: always()
        working-directory: tools/research_analyser/G_gee
        run: |
          set -euo pipefail
          rm -f /tmp/lager.zip
          zip -qr /tmp/lager.zip norge data vann -x 'norge/lett/*' 'norge/*.tmp'
          if [ -f kjorelogg_g2.json ]; then zip -q /tmp/lager.zip kjorelogg_g2.json; fi
          ls -l /tmp/lager.zip

      - name: Last opp lageret som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gee-lager
          path: /tmp/lager.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      # 2026-10-17: 2 i stedet for 5 — privat repo på GitHub Free har bare 500 MB lagerplass til artifacts,
      # og jobben trenger bare den nyeste (den forrige er reserve).
      - name: Rydd gamle artifacts (behold de 2 nyeste)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=gee-lager&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[2:] | .[].id' \
          | while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Slettet artifact $id"
            done
