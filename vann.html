<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-itunes-app" content="app-id=6817913220">   <!-- Apples app-banner i Safari på iPhone (2026-10-15) -->
<title>Vann — HatchWatch</title>
<meta name="theme-color" content="#0b1418">
<meta name="description" content="Isgang fra satellitt, anslått klekking og registrerte arter for norske vann.">
<link rel="icon" type="image/png" sizes="32x32" href="/logos/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/logos/apple-touch-icon-180.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/hw.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="/hw-lang.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  /* ═══ VANNSIDE (2026-10-14) ═══
     Landingsside per vann: /vann.html?id=<vatnlnr fra NVE Innsjødatabase>.
     Data: /data/kart/vann/<vatnlnr % 64>.json (bygges av tools/kart/bygg_kart.py vann):
     navn, moh, ha, kommune, punkt, isgang per år fra satellitt, artsfunn.
     Klekkingen regnes i nettleseren fra været ved vannet (open-meteo): vulgata fra varmesum,
     marginata/vespertina fra isgang OG varme (analyse J1–J3, 2026-10-14). Merket som anslag,
     med «Funnet her / Ikke registrert her» per art (Artsdatabanken + OFAs vulgata-vann). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; }
  .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; background: color-mix(in srgb, var(--hw-bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hw-line); }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--hw-fg-2); text-decoration: none; font-size: 14px; min-width: 70px; }
  .back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .top .brand { display: flex; align-items: center; gap: 6px; color: var(--hw-fg); text-decoration: none; font-family: var(--hw-display); font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .top .brand b { color: var(--hw-hatch); font-weight: 700; }
  .varsel label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--hw-line); cursor: pointer; }
  .varsel label:last-of-type { border-bottom: 0; }
  .varsel input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--hw-hatch); flex: none; }
  .varsel b { display: block; font-weight: 600; font-size: 15px; }
  .varsel span { font-size: 12.5px; color: var(--hw-fg-2); }
  .varsel .status { font-size: 13px; margin-top: 8px; min-height: 1.3em; color: #5fbf7a; }
  .varsel .status.feil { color: #e0655a; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-family: var(--hw-display); font-weight: 800; font-size: 34px; letter-spacing: -.03em; line-height: 1.05; margin-top: 6px; }
  .sub { color: var(--hw-fg-2); font-size: 14px; margin-top: 6px; }
  .ofa-aar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .ofa-aar div { background: var(--hw-bg-3); border-radius: 8px; padding: 6px 4px; text-align: center; }
  .ofa-aar span { display: block; font-family: var(--hw-mono); font-size: 10px; color: var(--hw-fg-3); }
  .ofa-aar b { font-family: var(--hw-mono); font-size: 13px; color: var(--hw-fg); }
  .grp.ofa { margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--hw-line); }
  .grp.fiskgrp { margin: 0 0 6px; }
  .grp.fiskgrp .note { margin-top: 6px; }
  .sp small.aar { font-family: var(--hw-mono); font-size: 10px; color: var(--hw-fg-3); font-style: normal; margin-left: 2px; }
  .sp small.innfort { font-size: 10px; font-style: normal; color: var(--hw-bad); margin-left: 2px; }
  .berggrunn { color: var(--hw-fg-2); font-size: 13.5px; margin-top: 4px; line-height: 1.45; }
  .berggrunn b { color: var(--hw-fg); font-weight: 600; }
  .berggrunn .kalkprikk { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; border: 1px solid rgba(0, 0, 0, .15); }
  .berggrunn .kilde { display: block; font-family: var(--hw-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--hw-fg-3); margin-top: 1px; }
  .card { background: var(--hw-bg-2); border: 1px solid var(--hw-line); border-radius: 18px; padding: 16px; margin-top: 14px; }
  .card h2 { font-family: var(--hw-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .lead { font-size: 14.5px; color: var(--hw-fg-2); line-height: 1.55; margin-top: 6px; }
  .card .lead b { color: var(--hw-fg); font-weight: 600; }
  .note { font-size: 12.5px; color: var(--hw-fg-3); line-height: 1.5; margin-top: 10px; }
  .note a, .lead a { color: var(--hw-water); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { background: var(--hw-bg-2); border: 1px solid var(--hw-line); border-radius: 16px; padding: 14px; }
  .stat .k { font-family: var(--hw-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--hw-fg-3); }
  .stat .v { font-family: var(--hw-display); font-weight: 800; font-size: 28px; letter-spacing: -.03em; line-height: 1.05; margin-top: 6px; }
  .stat .v.water { color: var(--hw-water); }
  .stat .v small { font-family: var(--hw-mono); font-weight: 500; font-size: 12px; color: var(--hw-fg-2); letter-spacing: 0; margin-left: 4px; }
  .stat .s { font-size: 12.5px; color: var(--hw-fg-2); margin-top: 4px; line-height: 1.4; }
  .arts { display: grid; gap: 10px; margin-top: 12px; }
  .art { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; padding: 12px; border-radius: 14px; background: var(--hw-bg-3); }
  .art b { font-family: var(--hw-display); font-weight: 700; font-size: 17px; }
  .art .d { font-family: var(--hw-display); font-weight: 800; font-size: 18px; color: var(--hw-hatch); text-align: right; }
  .art .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--hw-fg-2); }
  .art.muted .d { color: var(--hw-fg-2); }
  .art .s + .s { margin-top: 2px; }
  .pres { display: inline-flex; align-items: center; gap: 5px; font-family: var(--hw-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--hw-fg-3); margin-right: 4px; }
  .pres i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
  .pres.ja { color: #5fbf7a; }
  .pres.ja i { background: currentColor; }
  svg.yrs { width: 100%; max-width: 520px; height: auto; display: block; margin: 12px auto 0; }
  svg.yrs text { font-family: var(--hw-mono); font-size: 12px; fill: var(--hw-fg-3); }
  svg.yrs .iv { stroke: var(--hw-water); stroke-width: 3; stroke-linecap: round; opacity: .45; }
  svg.yrs .pt { fill: var(--hw-water); stroke: var(--hw-bg-2); stroke-width: 2; }
  svg.yrs .pt.cur { fill: var(--hw-hatch); }
  svg.yrs .med { stroke: var(--hw-fg-3); stroke-dasharray: 3 3; }
  svg.yrs .grid { stroke: var(--hw-line); }
  .splist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .sp { font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: var(--hw-bg-3); color: var(--hw-fg-2); }
  .sp i { font-style: italic; }
  .sp.key { color: var(--hw-hatch); background: var(--hw-hatch-soft); }
  .grp { margin-top: 12px; }
  .grp .hw-eyebrow { margin-bottom: 2px; }
  .maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--hw-bg) 80%, transparent) !important; color: var(--hw-fg-3) !important; font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: var(--hw-fg-2) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(.8); }
  #mini { height: 240px; border-radius: 14px; overflow: hidden; margin-top: 12px; background: #13242b; }
  :root[data-theme="light"] #mini { background: #e0fefe; }   /* lyst tema: minikartet bruker Kartverkets turkart */
  .row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .skel { color: var(--hw-fg-3); font-size: 13.5px; margin-top: 10px; }
  .miss { text-align: center; padding: 60px 16px; color: var(--hw-fg-2); }
  @media (max-width: 420px) { h1 { font-size: 30px; } .stat .v { font-size: 24px; } }
</style>
</head>
<body class="hw-dark">

<header class="top">
  <a class="back" href="/" id="backLink"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="backTxt">Kart</span></a>
  <a class="brand" href="/" aria-label="HatchWatch"><span class="hw-fly" style="width:26px;color:var(--hw-hatch)" aria-hidden="true"></span><span>Hatch<b>Watch</b></span></a>
  <button class="hw-iconbtn fav" id="fav" type="button" aria-label="Legg til i favoritter"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.7-9.3-9A5.2 5.2 0 0 1 12 6.6a5.2 5.2 0 0 1 9.3 4.9c-1.8 4.3-9.3 9-9.3 9z"/></svg></button>
</header>

<main class="wrap" id="main">
  <div class="skel" id="loading">Laster vannet…</div>
</main>

<script>
// ═══════════════════════════════════════════════════════════════════
//  VANNSIDE — isgang fra satellitt, marginata/vespertina anslått fra isgangen,
//  registrerte arter, nærmeste klekkeprognose og kart.
//  Ordlyd: «modellen anslo», aldri «det klekket». Vi ser isgang fra satellitt,
//  ikke klekking.
// ═══════════════════════════════════════════════════════════════════
var EN = window.HW_LANG === 'en';
function tx(no, en) { return EN ? en : no; }
if (EN) { document.documentElement.lang = 'en'; document.getElementById('backTxt').textContent = 'Map'; document.getElementById('loading').textContent = 'Loading the lake…'; }
var MON = EN ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] : ['jan', 'feb', 'mars', 'april', 'mai', 'juni', 'juli', 'aug', 'sep', 'okt', 'nov', 'des'];
var MOH = tx('moh', 'm a.s.l.');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function num(v, d) { if (v == null || isNaN(v)) return '–'; var s = (+v).toFixed(d == null ? 0 : d); return EN ? s : s.replace('.', ','); }
function dateOf(year, doy) { return new Date(year, 0, doy); }
function fmt(year, doy) { var d = dateOf(year, doy); return EN ? d.getDate() + ' ' + MON[d.getMonth()] : d.getDate() + '. ' + MON[d.getMonth()]; }
function fmtRange(year, a, b) {
  var da = dateOf(year, a), db = dateOf(year, b);
  if (da.getMonth() === db.getMonth()) return EN ? da.getDate() + '–' + db.getDate() + ' ' + MON[db.getMonth()] : da.getDate() + '.–' + db.getDate() + '. ' + MON[db.getMonth()];
  return fmt(year, a) + '–' + fmt(year, b);
}
function haversine(a, b, c, d) { var R = 6371, t = Math.PI / 180, x = (c - a) * t, y = (d - b) * t, h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a * t) * Math.cos(c * t) * Math.sin(y / 2) * Math.sin(y / 2); return 2 * R * Math.asin(Math.sqrt(h)); }
var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
var YEAR = TODAY.getFullYear();
// Svenske vann (2026-10-17): ?id=se<hylak_id>, data i /data/kart/se/vann/ (bygg_kart.py sverige). Ingen isgang,
// klekking, snø, berggrunn eller varsler ennå — bare arter, fisk og beregnet middeldyp.
var ID_PARAM = new URLSearchParams(location.search).get('id') || '';
var SE = /^se\d+$/.test(ID_PARAM);
var ID = SE ? +ID_PARAM.slice(2) : parseInt(ID_PARAM, 10);
var FAV_ID = SE ? 'se' + ID : ID;
var GRUPPER = 64;   // samme som VANN_GRUPPER i tools/kart/bygg_kart.py

// HatchWatch-lokasjonene (samme som forsiden) for «nærmeste klekkeprognose»
var LOCS = [
  ['kautokeino', 'Kautokeino', 69.010, 23.040], ['alta', 'Alta', 69.970, 23.270], ['porsanger', 'Porsanger', 70.070, 25.000],
  ['bardu', 'Bardu', 69.036, 18.820], ['mo_i_rana', 'Mo i Rana', 66.360, 14.692], ['borgefjell', 'Børgefjell', 65.109, 14.090],
  ['roros', 'Røros', 62.570, 11.390], ['trondheim', 'Trondheim', 63.483, 10.812], ['rena', 'Rena', 61.135, 11.650],
  ['romeriksasen', 'Romeriksåsen', 60.156, 10.892], ['nordmarka_dyn', 'Nordmarka', 59.940, 10.720], ['finnemarka', 'Finnemarka', 59.855, 10.303],
  ['ostmarka', 'Østmarka', 59.700, 11.170], ['vestfjella', 'Vestfjella', 59.300, 11.660], ['hardangervidda', 'Hardangervidda', 60.139, 8.547],
  ['bergen', 'Bergen', 60.500, 5.700]
];
// Artsnavn (2026-10-16, Stian): norsk navn på norsk, engelsk på engelsk — ikke latin i tillegg. Latin brukes bare der
// arten mangler navn på språket (sjeldne insekter og fiskeformer), og ligger ellers i hjelpeteksten (title).
var EN_NAVN = {
  // fisk
  'Salmo trutta': 'Brown trout', 'Salvelinus alpinus': 'Arctic char', 'Perca fluviatilis': 'Perch', 'Anguilla anguilla': 'European eel',
  'Phoxinus phoxinus': 'Minnow', 'Esox lucius': 'Pike', 'Lota lota': 'Burbot', 'Coregonus lavaretus': 'Whitefish',
  'Gasterosteus aculeatus': 'Three-spined stickleback', 'Rutilus rutilus': 'Roach', 'Salvelinus fontinalis': 'Brook trout',
  'Salmo salar': 'Atlantic salmon', 'Thymallus thymallus': 'Grayling', 'Oncorhynchus mykiss': 'Rainbow trout', 'Alburnus alburnus': 'Bleak',
  'Scardinius erythrophthalmus': 'Rudd', 'Abramis brama': 'Bream', 'Carassius carassius': 'Crucian carp', 'Gymnocephalus cernua': 'Ruffe',
  'Osmerus eperlanus': 'Smelt', 'Tinca tinca': 'Tench', 'Pungitius pungitius': 'Nine-spined stickleback', 'Leuciscus idus': 'Ide',
  'Coregonus albula': 'Vendace', 'Blicca bjoerkna': 'Silver bream', 'Leuciscus leuciscus': 'Dace', 'Lampetra fluviatilis': 'River lamprey',
  'Cottus poecilopus': 'Alpine bullhead', 'Lampetra planeri': 'Brook lamprey', 'Platichthys flesus': 'Flounder', 'Squalius cephalus': 'Chub',
  'Sander lucioperca': 'Zander', 'Salvelinus namaycush': 'Lake trout', 'Cyprinus carpio': 'Carp', 'Cottus gobio': 'Bullhead',
  'Oncorhynchus gorbuscha': 'Pink salmon', 'Ameiurus nebulosus': 'Brown bullhead', 'Leuciscus aspius': 'Asp', 'Carassius auratus': 'Goldfish',
  'Gobio gobio': 'Gudgeon', 'Petromyzon marinus': 'Sea lamprey', 'Lepomis gibbosus': 'Pumpkinseed', 'Myoxocephalus quadricornis': 'Fourhorn sculpin',
  'Oncorhynchus keta': 'Chum salmon', 'Ctenopharyngodon idella': 'Grass carp', 'Alosa alosa': 'Allis shad', 'Alosa fallax': 'Twaite shad',
  // insekter og krepsdyr (fluefiskernes engelske navn der de finnes)
  'Ephemera vulgata': 'Dark mayfly', 'Ephemera danica': 'Green drake', 'Leptophlebia marginata': 'Sepia dun', 'Leptophlebia vespertina': 'Claret dun',
  'Siphlonurus lacustris': 'Large summer dun', 'Siphlonurus aestivalis': 'Large summer dun', 'Baetis rhodani': 'Large dark olive',
  'Nigrobaetis niger': 'Iron blue', 'Heptagenia sulphurea': 'Yellow May dun', 'Serratella ignita': 'Blue-winged olive', 'Ephemerella ignita': 'Blue-winged olive',
  'Caenis horaria': 'Angler\'s curse', 'Caenis luctuosa': 'Angler\'s curse', 'Cloeon dipterum': 'Pond olive', 'Centroptilum luteolum': 'Small spurwing',
  'Phryganea grandis': 'Great red sedge', 'Gammarus lacustris': 'Freshwater shrimp', 'Gammarus pulex': 'Freshwater shrimp', 'Lepidurus arcticus': 'Tadpole shrimp'
};
// Visningsnavn: språkets navn hvis det finnes, ellers latin (i kursiv, siden det da er det vitenskapelige navnet)
function artsnavn(latin, norsk) {
  var n = EN ? EN_NAVN[latin] : (norsk ? norsk.charAt(0).toUpperCase() + norsk.slice(1) : '');
  return n ? esc(n) : '<i>' + esc(latin) + '</i>';
}
var KEY_SPECIES = ['Ephemera vulgata', 'Ephemera danica', 'Leptophlebia marginata', 'Leptophlebia vespertina', 'Siphlonurus lacustris', 'Siphlonurus aestivalis', 'Ephemerella aurivillii', 'Heptagenia dalecarlica', 'Phryganea grandis', 'Phryganea bipunctata', 'Lepidurus arcticus', 'Gammarus lacustris'];

var main = document.getElementById('main');
if (!ID) main.innerHTML = '<div class="miss">' + tx('Mangler vann.', 'No lake given.') + ' <a href="/">' + tx('Til kartet', 'To the map') + '</a></div>';
else fetch('/data/kart/' + (SE ? 'se/' : '') + 'vann/' + (ID % GRUPPER) + '.json').then(function (r) { return r.json(); }).then(function (d) {
  var v = d[String(ID)];
  if (!v) { main.innerHTML = '<div class="miss"><h1 style="font-size:24px">' + tx('Fant ikke vannet', 'Lake not found') + '</h1><p class="lead" style="margin-top:10px"><a href="/">' + tx('Tilbake til kartet', 'Back to the map') + '</a></p></div>'; return; }
  if (SE) renderSE(v); else render(v);
}).catch(function () { main.innerHTML = '<div class="miss">' + tx('Klarte ikke å laste vannet.', 'Could not load the lake.') + '</div>'; });

function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

function render(v) {
  var navn = v.navn || tx('Navnløst vann', 'Unnamed lake');
  document.title = navn + ' — HatchWatch';
  var isg = v.isg || {}, years = Object.keys(isg).map(Number).sort(), h = '';
  var ly = years.length ? years[years.length - 1] : null;          // siste år med satellittdato
  var med = years.length >= 3 ? Math.round(median(years.map(function (y) { return isg[y][0]; }))) : null;

  h += '<div class="hw-eyebrow gold">' + tx('Vann', 'Lake') + (v.kommune ? ' · ' + esc(v.kommune) : '') + '</div>';
  h += '<h1>' + esc(navn) + '</h1>';
  h += '<div class="sub">' + [v.moh != null ? v.moh + ' ' + MOH : '', num(v.ha, v.ha < 100 ? 1 : 0) + ' ha'].filter(Boolean).join(' · ') + '</div>';
  h += '<div class="berggrunn" id="berggrunn"></div>';   // fylles fra NGU (hentBerggrunn)

  // ── Isgang, hovedtall ──
  if (ly) {
    var r = isg[ly], half = r[1] != null ? Math.max(1, Math.round(r[1] / 2)) : null;
    var diff = med != null ? r[0] - med : null;
    var cmp = diff == null ? '' : Math.abs(diff) <= 2 ? tx('omtrent som vanlig', 'about as usual')
            : diff < 0 ? tx(-diff + ' dager tidligere enn vanlig', -diff + ' days earlier than usual') : tx(diff + ' dager senere enn vanlig', diff + ' days later than usual');
    h += '<div class="hero">' +
      '<div class="stat"><div class="k">' + tx('Isgang ', 'Ice-out ') + ly + '</div><div class="v water">' + fmt(ly, r[0]) + (half ? '<small>±' + half + ' d</small>' : '') + '</div><div class="s">' + (cmp ? cmp.charAt(0).toUpperCase() + cmp.slice(1) + '.' : tx('Satellittanslag.', 'Satellite estimate.')) + '</div></div>' +
      '<div class="stat"><div class="k">' + tx('Vanlig isgang', 'Usual ice-out') + '</div><div class="v">' + (med != null ? fmt(ly, med) : '–') + '</div><div class="s">' + (med != null ? tx('midtverdi for ' + years.length + ' år', 'median of ' + years.length + ' years') : tx('for få år ennå', 'too few years yet')) + '</div></div>' +
      '</div>';
  }

  // ── Klekking: regnes ut fra været ved vannet (fylles inn når været er hentet) ──
  h += '<div class="card" id="klekkCard"><h2>' + tx('Klekking', 'Hatch') + '<span class="hw-chip soon"><i></i>' + tx('Anslag', 'Estimate') + '</span></h2>' +
       '<div id="klekk" class="skel">' + tx('Henter været ved vannet…', 'Fetching the weather at the lake…') + '</div>' +
       // Meld klekking her: skjemaet får vannets ID, så meldingen kobles til satellittisgangen for akkurat dette vannet
       '<div class="row2"><a class="hw-btn ghost" href="/observasjon.html?vann=' + ID + '&navn=' + encodeURIComponent(navn) + (v.moh != null ? '&moh=' + v.moh : '') + '">' + tx('Meld klekking her', 'Report a hatch here') + '</a></div>' +
       '<p class="note" style="margin-top:6px">' + tx('Så du klekking i dette vannet? Én melding med dato gjør anslagene bedre for alle.', 'Saw a hatch in this lake? One report with a date makes the estimates better for everyone.') + '</p></div>';

  // ── Isgang år for år ──
  if (years.length) {
    h += '<div class="card"><h2>' + tx('Isgang år for år', 'Ice-out year by year') + '</h2>' +

// ═══ SNØ (2026-10-14) ═══
// seNorge snødybde (NVE/MET, 1 km rutenett) for ruta vannet ligger i, siste fem vintre. Viser snødybde nå
// (vinter/vår) og dagen snøen gikk i år, i fjor og vanligvis. Nyttig for fjellvann tidlig i sesongen.
var API_BASE = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'https://www.hatchwatch.no' : '';
function tilUtm33(lat, lon) {
  // WGS84/ETRS89 → UTM sone 33N (EPSG:25833). Standard Transverse Mercator-utvikling (cm-nøyaktig).
  var a = 6378137, f = 1 / 298.257222101, k0 = 0.9996, lon0 = 15 * Math.PI / 180;
  var e2 = f * (2 - f), ep2 = e2 / (1 - e2), r = Math.PI / 180, phi = lat * r, lam = lon * r;
  var N = a / Math.sqrt(1 - e2 * Math.sin(phi) * Math.sin(phi)), T = Math.tan(phi) * Math.tan(phi), C = ep2 * Math.cos(phi) * Math.cos(phi), A = Math.cos(phi) * (lam - lon0);
  var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * phi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * phi)
          + (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * phi) - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * phi));
  var x = k0 * N * (A + (1 - T + C) * A * A * A / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
  var y = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
  return [Math.round(x), Math.round(y)];
}
function snofriDag(serie, aar) {
  // serie: { 'YYYY-MM-DD': cm }. Dagen etter siste dag med snø (>= 1 cm) mellom 1. feb og 31. juli.
  var siste = null, slutt = null;
  for (var d = new Date(aar, 1, 1); d.getMonth() <= 6; d.setDate(d.getDate() + 1)) {
    var v = serie[ymd(d)];
    if (v == null) continue;
    slutt = new Date(d);
    if (v >= 1) siste = new Date(d);
  }
  if (!siste) return { ingen: true };
  if (slutt && +siste === +slutt) return { ligger: true };     // snøen ligger fortsatt ved siste dag med data
  var n = new Date(siste); n.setDate(n.getDate() + 1);
  return { doy: doyOf(n) };
}
function hentSno(v) {
  var el = document.getElementById('sno'); if (!el) return;
  var xy = tilUtm33(v.lat, v.lon), igaar = new Date(TODAY); igaar.setDate(igaar.getDate() - 1);

  // Linje om isgangen
  if (ig && ig.sat) h += '<p class="lead">' + tx('Isen gikk ' + fmt(S, ig.n) + ' (satellitt). ', 'The ice went out on ' + fmt(S, ig.n) + ' (satellite). ') + (ferdig ? tx('Med været i ' + S + ' gir modellen dette:', 'With the weather in ' + S + ' the model gives this:') : tx('Med målt vær og varsel gir modellen dette:', 'With measured weather and the forecast the model gives this:')) + '</p>';
  else if (ig && ig.tidlig) h += '<p class="lead">' + tx('Isen går vanligvis tidlig her, rundt ' + fmt(S, ig.n) + '. Da styrer varmen klekkingen mer enn isgangen.', 'The ice usually goes early here, around ' + fmt(S, ig.n) + '. Then warmth governs the hatch more than ice-out.') + '</p>';
  else if (ig && ig.prognose && ferdig) h += '<p class="lead">' + tx('Satellitten fant ingen sikker isgangdato i ' + S + '. Ut fra varmen anslår modellen at isen gikk rundt <b>' + fmt(S, ig.n) + '</b>, med typisk en ukes usikkerhet.', 'The satellite found no reliable ice-out date in ' + S + '. From the warmth, the model estimates the ice went out around <b>' + fmt(S, ig.n) + '</b>, with typically a week of uncertainty.') + snoTekst + '</p>';
  else if (ig && ig.prognose) h += '<p class="lead">' + tx('Satellitten har ikke sett isgangen for ' + S + ' ennå. Modellen anslår at isen går rundt <b>' + fmt(S, ig.n) + '</b>, ut fra hvor mye varme som pleier å trengs i dette vannet' + (ig.sno ? ', varmen hittil i år og snømengden' : ' og varmen hittil i år') + '. To uker i forveien bommer den typisk med en uke.', 'The satellite has not seen ice-out for ' + S + ' yet. The model estimates the ice goes around <b>' + fmt(S, ig.n) + '</b>, from how much warmth this lake usually needs' + (ig.sno ? ', the warmth so far this year and the amount of snow' : ' and the warmth so far this year') + '. Two weeks ahead it typically misses by a week.') + snoTekst + '</p>';
  var rows = '';
  // Marginata og vespertina
  var gMarg = naar(s, 91, T_MARG);
  if (ig && gMarg) {
    var ms = Math.max(ig.n + 14, gMarg.n), maalt = gMarg.maalt && (ig.sat || ms === gMarg.n);
    var styrt = ms === gMarg.n ? tx('varmen styrer', 'warmth governs') : tx('isgangen styrer', 'ice-out governs');
    rows += '<div class="art"><b>Marginata</b><span class="d">' + fmtRange(S, ms, ms + 7) + '</span><span class="s"><i>Leptophlebia marginata</i> · ' + tx('topp rundt ', 'peak around ') + fmt(S, ms + 3) + ' · ' + styrt + ' · ' + etikett(maalt) + '</span><span class="s">' + tilstede(v, 'Leptophlebia marginata', 'marginata') + '</span></div>';
    rows += '<div class="art"><b>Vespertina</b><span class="d">' + fmtRange(S, ms + 7, ms + 21) + '</span><span class="s"><i>Leptophlebia vespertina</i> · ' + tx('topp rundt ', 'peak around ') + fmt(S, ms + 14) + ' · ' + etikett(maalt) + '</span><span class="s">' + tilstede(v, 'Leptophlebia vespertina', 'vespertina') + '</span></div>';
  } else {
    rows += '<div class="art muted"><b>Marginata · Vespertina</b><span class="d">–</span><span class="s">' + (stor ? tx('Vannet er for stort for satellittmetoden, så vi har ingen isgang å regne fra.', 'The lake is too large for the satellite method, so we have no ice-out to work from.') : tx('Vi har for få isgangdatoer fra satellitt for dette vannet ennå.', 'We have too few satellite ice-out dates for this lake yet.')) + '</span></div>';
  }
  // Vulgata
  var g450 = naar(s, 91, T_VULG);
  // Sen is: luftvarmen kan gi vulgata før marginata. Ikke testet hvor mye isen forsinker vulgata, så vi sier det i stedet for å regne
  var senIs = g450 && ig && gMarg && g450.n < Math.max(ig.n + 14, gMarg.n) + 7;
  if (stor) rows += '<div class="art muted"><b>Vulgata</b><span class="d">–</span><span class="s"><i>Ephemera vulgata</i> · ' + tx('Store, dype vann varmes opp mye senere enn luften, så modellen bommer der med flere uker. Vi viser ikke anslag for vann over 30 km².', 'Large, deep lakes warm up much later than the air, so the model misses there by weeks. We show no estimate for lakes over 30 km².') + '</span><span class="s">' + tilstede(v, 'Ephemera vulgata', 'vulgata') + '</span></div>';
  else if (g450) rows += '<div class="art"><b>Vulgata</b><span class="d">' + fmt(S, g450.n) + ' <small style="font-size:12px;color:var(--hw-fg-2)">±5 d</small></span><span class="s"><i>Ephemera vulgata</i> · ' + tx('start på klekkingen', 'start of the hatch') + ' · ' + etikett(g450.maalt) + (middels ? ' · ' + tx('store vann kan ligge etter', 'large lakes can lag behind') : '') + '</span>' +
    (senIs ? '<span class="s" style="color:var(--hw-hatch)">' + tx('Isen går sent her. Vulgata kommer trolig senere enn luftvarmen tilsier, men hvor mye er ikke testet ennå.', 'The ice goes late here. Vulgata probably comes later than the air warmth suggests, but by how much is not tested yet.') + '</span>' : '') +
    '<span class="s">' + tilstede(v, 'Ephemera vulgata', 'vulgata') + '</span></div>';
  // Grandis: samme varmesum som vulgata, terskel 525. Skjult i store vann av samme grunn som vulgata.
  var gGrand = naar(s, 91, T_GRAND);
  if (stor) rows += '<div class="art muted"><b>Grandis</b><span class="d">–</span><span class="s"><i>Phryganea grandis</i> · ' + tx('Store, dype vann varmes opp mye senere enn luften. Vi viser ikke anslag for vann over 30 km².', 'Large, deep lakes warm up much later than the air. We show no estimate for lakes over 30 km².') + '</span><span class="s">' + tilstede(v, 'Phryganea grandis', 'grandis') + '</span></div>';
  else if (gGrand) rows += '<div class="art"><b>Grandis</b><span class="d">' + tx('fra ca. ', 'from about ') + fmt(S, gGrand.n) + '</span><span class="s"><i>Phryganea grandis</i> · ' + tx('flyr omtrent fra denne datoen, mest sent på kvelden og om natten', 'flies from about this date, mostly late evening and at night') + ' · ' + etikett(gGrand.maalt) + '</span>' +
    '<span class="s">' + tx('Grovt anslag fra artsfunn, ikke testet mot klekkestart.', 'Rough estimate from species records, not tested against hatch start.') + ((v.moh > 500 || v.lat >= 63) ? ' ' + tx('Fjell og nord er nesten ikke testet, og her kan den komme tidligere.', 'Mountains and the north are barely tested, and it may come earlier here.') : '') + '</span>' +
    '<span class="s">' + tilstede(v, 'Phryganea grandis', 'grandis') + '</span></div>';
  // Byttedyr (2026-10-14): skjoldkreps og marflo, BARE der Artsdatabanken har funn. Kilder: Qvenild m.fl. 2018
  // (Fauna norvegica 38): klekker ved isgang, i ørretmager fra ca. 400 døgngrader i vannet etter isgang, flest
  // ved 800–900 (midten av aug–midten av sep på Hardangervidda); Qvenild & Hesthagen 2019: funn 27. juli–2. okt.
  // «Isgang + 5 uker» er vår grove omregning av 400 døgngrader (Hardangervidda: isgang sent i juni → ca. 1. aug).
  // Marflo: lever 1–2 år, alltid tilgjengelig, grunt og vegetasjonsrikt ned til ca. 5 m (Dahl 1915/1930 via
  // Qvenild m.fl. 2020). Ingen norsk kilde tidfester en topp for marflo, så vi viser ingen.
  var harArt = function (latin) { return (v.arter || []).some(function (a) { return a[0] === latin; }); };
  var krepsdyr = false;
  if (harArt('Lepidurus arcticus')) {
    krepsdyr = true;
    var sept30 = Math.round((new Date(S, 8, 30) - new Date(S, 0, 0)) / 864e5), lsStart = ig ? ig.n + 35 : null;
    rows += '<div class="art"><b>' + tx('Skjoldkreps', 'Tadpole shrimp') + '</b><span class="d">' + (lsStart && lsStart < sept30 - 14 ? fmtRange(S, lsStart, sept30) : tx('aug–sep', 'Aug–Sep')) + '</span><span class="s"><i>Lepidurus arcticus</i> · ' +
      tx('klekker ved isgang og blir viktig ørretmat rundt fem uker senere, mest fra midten av august til midten av september på Hardangervidda. Kommer senere, eller knapt, i kalde somre', 'hatches at ice-out and becomes important trout food about five weeks later, mostly mid-August to mid-September on Hardangervidda. Comes later, or barely, in cold summers') + ' · ' + tx('grovt anslag', 'rough estimate') + '</span><span class="s">' + tilstede(v, 'Lepidurus arcticus', '') + '</span></div>';
  }
  if (harArt('Gammarus lacustris')) {
    krepsdyr = true;
    rows += '<div class="art"><b>' + tx('Marflo', 'Freshwater shrimp') + '</b><span class="d">' + tx('hele sesongen', 'all season') + '</span><span class="s"><i>Gammarus lacustris</i> · ' +
      tx('lever ett til to år, så den finnes også før insektene kommer. Langs land i grunne områder med vegetasjon, ned til rundt 5 m', 'lives one to two years, so it is there before the insects come too. Along the shore in shallow, vegetated areas, down to about 5 m') + '</span><span class="s">' + tilstede(v, 'Gammarus lacustris', '') + '</span></div>';
  }
  rows += vulgataRow(v);
  h += '<div class="arts">' + rows + '</div>';
  if (krepsdyr) h += '<p class="note">' + tx('Skjoldkreps og marflo vises bare der Artsdatabanken har funn. Kilder: Qvenild m.fl. 2018 og 2020, Qvenild og Hesthagen 2019 (Fauna norvegica, Hardangervidda). Fem uker etter isgang er vår grove omregning av varmen skjoldkrepsen trenger.', 'Tadpole shrimp and freshwater shrimp are only shown where Artsdatabanken has records. Sources: Qvenild et al. 2018 and 2020, Qvenild and Hesthagen 2019 (Fauna norvegica, Hardangervidda). Five weeks after ice-out is our rough conversion of the warmth the tadpole shrimp needs.') + '</p>';
  h += '<p class="note">' + tx('Slik regner vi: marginata starter når isen har gått og våren har gitt nok varme, vespertina en uke senere. Vulgata starter når varmesummen fra 1. april har nådd et fast nivå, grandis når den har nådd et høyere nivå. Temperaturen er luft ved vannet, skalert til vannets høyde. For vulgata bommer modellen typisk med rundt 5 dager der den er testet (Østlandet og Kautokeino); for marginata og vespertina er den bare sjekket mot spredte artsfunn. Vannene der vi har en kalibrert prognose, har egen side.',
                               'How we work it out: marginata starts when the ice has gone and spring has given enough warmth, vespertina a week later. Vulgata starts when the warmth sum from 1 April reaches a fixed level, grandis when it reaches a higher one. Temperature is air at the lake, scaled to its altitude. For vulgata the model typically misses by about 5 days where it has been tested (eastern Norway and Kautokeino); for marginata and vespertina it has only been checked against scattered species records. Lakes with a calibrated forecast have their own page.') + '</p>';
  el.className = ''; el.innerHTML = h;
}

// Nærmeste HatchWatch-sted med egen prognose (innen 40 km): lenke under anslagene
function vulgataRow(v) {
  var best = null, bd = 1e9;
  LOCS.forEach(function (l) { var d = haversine(v.lat, v.lon, l[2], l[3]); if (d < bd) { bd = d; best = l; } });
  if (!best || bd >= 40) return '';
  return '<div class="art muted"><b>' + tx('Egen prognose i nærheten', 'Own forecast nearby') + '</b><span class="d"><a href="/dashboard.html?loc=' + best[0] + '" style="color:inherit">' + best[1] + '</a></span><span class="s">' + tx(Math.round(bd) + ' km unna. Der har vi daglig prognose med stasjonsdata, og for noen steder kalibrering mot egne observasjoner.', Math.round(bd) + ' km away. There we have a daily forecast with station data, and for some places calibration against our own observations.') + '</span></div>';
}

function yrsSvg(isg, years, med, ly) {
  var lo = Infinity, hi = -Infinity;
  years.forEach(function (y) { var r = isg[y], w = (r[1] || 0) / 2; lo = Math.min(lo, r[0] - w); hi = Math.max(hi, r[0] + w); });
  lo = Math.floor(lo - 4); hi = Math.ceil(hi + 4);
  var W = 420, H = 170, L = 66, B = 20, n = years.length, cw = (W - L - 10) / n;   // smal viewBox: lesbar tekst på mobil
  var y = function (d) { return 8 + (H - 16) * (d - lo) / Math.max(1, hi - lo); };   // tidlig øverst
  var s = '<svg class="yrs" viewBox="0 0 ' + W + ' ' + (H + B) + '" role="img" aria-label="' + tx('Isgang per år', 'Ice-out per year') + '">';
  // datolinjer: 1. og 15. i hver måned i spennet
  for (var m = 2; m <= 7; m++) [1, 15].forEach(function (dd) {
    var doy = Math.round((Date.UTC(2021, m, dd) - Date.UTC(2021, 0, 1)) / 86400000) + 1;
    if (doy > lo && doy < hi) s += '<line class="grid" x1="' + L + '" x2="' + (W - 10) + '" y1="' + y(doy) + '" y2="' + y(doy) + '"/><text x="' + (L - 6) + '" y="' + (y(doy) + 3) + '" text-anchor="end">' + (EN ? dd + ' ' + MON[m] : dd + '. ' + MON[m].slice(0, 3)) + '</text>';
  });
  if (med != null) s += '<line class="med" x1="' + L + '" x2="' + (W - 10) + '" y1="' + y(med) + '" y2="' + y(med) + '"/>';
  years.forEach(function (yy, i) {
    var r = isg[yy], cx = L + cw * i + cw / 2, w = (r[1] || 0) / 2;
    if (w) s += '<line class="iv" x1="' + cx + '" x2="' + cx + '" y1="' + y(r[0] - w) + '" y2="' + y(r[0] + w) + '"/>';
    s += '<circle class="pt' + (yy === ly ? ' cur' : '') + '" cx="' + cx + '" cy="' + y(r[0]) + '" r="5.5"><title>' + yy + ': ' + fmt(yy, r[0]) + (w ? ' ±' + Math.max(1, Math.round(w)) + ' d' : '') + '</title></circle>';
    s += '<text x="' + cx + '" y="' + (H + 14) + '" text-anchor="middle">' + String(yy).slice(2) + '</text>';
  });
  return s + '</svg>' + (med != null ? '<div class="note" style="margin-top:4px">' + tx('Stiplet linje: vanlig isgang (midtverdi).', 'Dashed line: usual ice-out (median).') + '</div>' : '');
}

function arterHtml(list) {
  if (!list || !list.length) return '<p class="lead">' + tx('Ingen artsbestemte funn av døgnfluer, vårfluer, marflo eller skjoldkreps er koblet til dette vannet ennå. Det betyr ikke at de mangler, bare at ingen har registrert dem her.', 'No identified mayfly, caddis, Gammarus or tadpole shrimp records are linked to this lake yet. That does not mean they are missing, only that nobody has recorded them here.') + '</p>';
  var grp = { d: tx('Døgnfluer', 'Mayflies'), v: tx('Vårfluer', 'Caddis'), m: tx('Marflo', 'Gammarus'), s: tx('Skjoldkreps', 'Tadpole shrimp'), a: tx('Annet', 'Other') }, by = {};
  list.forEach(function (x) { (by[x[1]] = by[x[1]] || []).push(x); });
  var h = '';
  ['d', 'v', 'm', 's', 'a'].forEach(function (g) {
    if (!by[g]) return;
    var items = by[g].slice().sort(function (a, b) { var ka = KEY_SPECIES.indexOf(a[0]) >= 0 ? 0 : 1, kb = KEY_SPECIES.indexOf(b[0]) >= 0 ? 0 : 1; return ka - kb || b[2] - a[2]; });
    h += '<div class="grp"><div class="hw-eyebrow">' + grp[g] + ' · ' + items.length + '</div><div class="splist">' + items.map(function (x) {
      return '<span class="sp' + (KEY_SPECIES.indexOf(x[0]) >= 0 ? ' key' : '') + '" title="' + esc(x[0]) + ' · ' + x[2] + tx(' funn, sist ', ' records, last ') + (x[3] || '–') + '">' + artsnavn(x[0], x[5]) + '</span>';
    }).join('') + '</div></div>';
  });
  return h + '<p class="note">' + (SE ? tx('Artportalen (SLU Artdatabanken) via GBIF. ', 'Artportalen (SLU Swedish Species Information Centre) via GBIF. ') : '') + tx((SE ? '' : 'Artsdatabanken via GBIF. ') + 'Registrert betyr at minst ett funn er koblet til vannet, ikke at arten sikkert finnes der i dag. Gull er arter som er viktige for fluefiske.', (SE ? '' : 'Artsdatabanken via GBIF. ') + 'Recorded means at least one record is linked to the lake, not that the species is surely there today. Gold marks species that matter for fly fishing.') + '</p>';
}

function miniMap(v) {
  if (!window.maplibregl || v.lat == null) { var m = document.getElementById('mini'); if (m) m.style.display = 'none'; return; }
  var protocol = new pmtiles.Protocol(); maplibregl.addProtocol('pmtiles', protocol.tile);
  // Lyst tema (Turkart valgt, 2026-10-15): Kartverkets topo som bakgrunn, vannet markert med gull kant
  var lys = document.documentElement.getAttribute('data-theme') === 'light';
  var kilder = { omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' }, hw: { type: 'vector', url: 'pmtiles://' + location.origin + '/data/kart/hatchwatch.pmtiles' } };
  if (lys) kilder.kv = { type: 'raster', tileSize: 256, tiles: ['https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png'] };
  var map = new maplibregl.Map({
    container: 'mini', interactive: false, attributionControl: false,
    preserveDrawingBuffer: /^(localhost|127\.0\.0\.1)$/.test(location.hostname),
    center: [v.lon, v.lat], zoom: v.ha > 2000 ? 9.5 : v.ha > 300 ? 11 : v.ha > 60 ? 12.3 : 13.3,
    style: {
      version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
      sources: kilder,
      layers: lys ? [
        { id: 'bg', type: 'background', paint: { 'background-color': '#e0fefe' } },
        { id: 'kv', type: 'raster', source: 'kv' },
        { id: 'dette-kant2', type: 'line', source: 'hw', 'source-layer': 'vann', filter: ['==', ['get', 'vatnlnr'], ID], paint: { 'line-color': '#0b1418', 'line-width': 4 } },
        { id: 'dette-kant', type: 'line', source: 'hw', 'source-layer': 'vann', filter: ['==', ['get', 'vatnlnr'], ID], paint: { 'line-color': '#f2b84b', 'line-width': 2.5 } },
        { id: 'navn', type: 'symbol', source: 'hw', 'source-layer': 'vann', filter: ['==', ['get', 'vatnlnr'], -1], layout: { 'text-field': '' } }   // holder plass til dybdelaget (legges før «navn»)
      ] : [
        { id: 'bg', type: 'background', paint: { 'background-color': '#13242b' } },
        { id: 'wood', type: 'fill', source: 'omt', 'source-layer': 'landcover', filter: ['==', ['get', 'class'], 'wood'], paint: { 'fill-color': '#152a2f' } },
        { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': '#081217' } },
        { id: 'vann', type: 'fill', source: 'hw', 'source-layer': 'vann', paint: { 'fill-color': '#24434f' } },
        { id: 'dette', type: 'fill', source: 'hw', 'source-layer': 'vann', filter: ['==', ['get', 'vatnlnr'], ID], paint: { 'fill-color': '#5cc6e8' } },
        { id: 'dette-kant', type: 'line', source: 'hw', 'source-layer': 'vann', filter: ['==', ['get', 'vatnlnr'], ID], paint: { 'line-color': '#f2b84b', 'line-width': 2 } },
        { id: 'road', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 9, filter: ['in', ['get', 'class'], ['literal', ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'track']]], paint: { 'line-color': '#29424a', 'line-width': 1 } },
        { id: 'navn', type: 'symbol', source: 'hw', 'source-layer': 'vann', filter: ['!=', ['get', 'navn'], ''], layout: { 'text-field': ['get', 'navn'], 'text-font': ['Noto Sans Italic'], 'text-size': 11 }, paint: { 'text-color': '#8fb6c3', 'text-halo-color': '#0b1418', 'text-halo-width': 1.4 } }
      ]
    }
  });
  map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: 'NVE' + (lys ? ' · Kartverket' : '') }));
  // Dybdekoter fra NVE oppå vannet når de finnes digitalt (2026-10-14)
  dybdeP.then(function (d) {
    if (!d || d[5] !== 1) return;
    var leggTil = function () {
      map.addSource('nve-dybde', { type: 'raster', tileSize: 256, tiles: [NVE_WMS + 'DybdeKurve'] });
      map.addLayer({ id: 'nve-dybde', type: 'raster', source: 'nve-dybde' }, 'navn');
    };
    if (map.isStyleLoaded()) leggTil(); else map.once('load', leggTil);
  });
  var fold = function () { var a = document.querySelector('#mini .maplibregl-ctrl-attrib'); if (a) a.classList.remove('maplibregl-compact-show'); };
  map.once('load', fold); setTimeout(fold, 1500);
}
</script>
